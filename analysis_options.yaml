include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Scratch directories that can hold stale copies of this package. Without
    # this the analyzer walks them and reports the same findings several times
    # over, against paths that are not the real source.
    - _to_delete/**
    - .bridge/**
    - example/build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Public API of a package should be documented.
    public_member_api_docs: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
