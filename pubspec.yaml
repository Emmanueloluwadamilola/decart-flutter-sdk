name: decart_vton_flutter
description: >-
  Realtime Decart virtual try-on for Flutter with live camera streaming,
  garment images, prompts, camera switching, and Android/iOS platform views.
version: 1.0.1
homepage: https://github.com/Emmanueloluwadamilola/decart-flutter-sdk
repository: https://github.com/Emmanueloluwadamilola/decart-flutter-sdk
issue_tracker: https://github.com/Emmanueloluwadamilola/decart-flutter-sdk/issues
documentation: https://github.com/Emmanueloluwadamilola/decart-flutter-sdk#readme

topics:
  - virtual-try-on
  - fashion
  - camera
  - webrtc
  - ai

screenshots:
  - description: Full-screen virtual try-on camera with minimal controls.
    path: screenshots/example.png

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.decart.vton.flutter
        pluginClass: DecartVtonPlugin
      ios:
        pluginClass: DecartVtonPlugin
        sharedDarwinSource: false
