name: decart_vton_example
description: Example app for decart_vton_flutter — realtime virtual try-on.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  decart_vton_flutter:
    path: ../

  # Camera permission is the app's responsibility, not the plugin's.
  permission_handler: ^11.3.1

  # Picking a garment reference image from the photo library.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
