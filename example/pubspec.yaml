name: decart_vton_example
description: Example app for decart_vton_flutter — realtime virtual try-on.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  decart_vton_flutter:
    path: ../

  # Loads DECART_API_KEY from example/.env so no key is ever hardcoded or
  # committed. See .env.example.
  flutter_dotenv: ^5.2.1

  # Camera permission is the app's responsibility, not the plugin's.
  permission_handler: ^11.3.1

  # Picking a garment reference image from the photo library.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
